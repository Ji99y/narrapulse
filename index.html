<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NarraPulse — BSC Narrative Momentum Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-dark: #0b0e14;
      --card-bg: #151921;
      --card-border: #222733;
      --text-main: #f0f4f8;
      --text-muted: #8c9ba5;
      --accent-green: #10b981;
      --accent-yellow: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      padding: 4px 8px;
      border-radius: 4px;
      background: #1f2937;
      color: var(--text-muted);
    }

    .grid-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: var(--font-mono);
    }

    .card-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 900px) {
      .two-col { grid-template-columns: 1fr; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }

    th {
      background: #1a202c;
      color: var(--text-muted);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--card-border);
      font-size: 0.75rem;
      text-transform: uppercase;
    }

    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--card-border);
      font-family: var(--font-mono);
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .text-green { color: var(--accent-green); }
    .text-red { color: var(--accent-red); }
    .text-yellow { color: var(--accent-yellow); }

    .watchlist-item {
      background: rgba(16, 185, 129, 0.05);
      border-left: 3px solid var(--accent-green);
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
    }

    .loader {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>NarraPulse</h1>
      <span class="status-badge" id="last-updated">Updating...</span>
    </div>
    <div>
      <span class="status-badge" id="btc-24h">BTC 24h: --</span>
    </div>
  </header>

  <div id="content">
    <div class="loader">Fetching latest market and narrative data...</div>
  </div>

  <script>
    // ─── REGIME ──────────────────────────────────────────────────────────────────
    function detectRegime(metrics) {
      const btcDom = metrics.btc_dominance;
      const vol = metrics.quote.USD.total_volume_24h;
      const mcap = metrics.quote.USD.total_market_cap;
      const volMcap = vol / mcap;

      if (btcDom > 58)
        return { regime: "BTC_DOMINANCE", risk: "LOW", note: "Altcoins suppressed — be very selective, stick to top 50" };
      if (btcDom < 50)
        return { regime: "ALTSEASON", risk: "HIGH", note: "Broad altcoin momentum — wider opportunities, tighten stops" };
      if (volMcap > 0.05)
        return { regime: "ACTIVE", risk: "MED", note: "Healthy volume — standard position sizing" };
      return { regime: "QUIET", risk: "LOW", note: "Low volume — reduce position sizes, wait for confirmation" };
    }

    // ─── SENTIMENT COMPOSITE ─────────────────────────────────────────────────────
    function computeSentiment(metrics, tokens) {
      const qualified = tokens.filter((t) => {
        const fdv = t.quote.USD.fully_diluted_market_cap || t.quote.USD.market_cap || 0;
        return fdv > 50000000 && (t.quote.USD.volume_24h || 0) > 5000000;
      });
      const positive24h = qualified.filter((t) => (t.quote.USD.percent_change_24h || 0) > 0);
      const breadth = qualified.length ? (positive24h.length / qualified.length) * 100 : 50;
      const btcDom = metrics.btc_dominance || 50;
      const btcScore = Math.max(0, Math.min(100, (65 - btcDom) * 3.33 + 50));
      const vol = metrics.quote.USD.total_volume_24h;
      const mcap = metrics.quote.USD.total_market_cap;
      const volScore = Math.min(100, (vol / mcap) * 1000);
      const score = Math.round(breadth * 0.5 + btcScore * 0.3 + volScore * 0.2);

      let gate, label, emoji;
      if (score <= 20) { gate = "EXTREME_FEAR"; emoji = "🔴"; label = `EXTREME FEAR (${score}/100)`; }
      else if (score <= 40) { gate = "FEAR"; emoji = "🟠"; label = `FEAR (${score}/100)`; }
      else if (score <= 60) { gate = "NEUTRAL"; emoji = "⚪"; label = `NEUTRAL (${score}/100)`; }
      else if (score <= 80) { gate = "GREED"; emoji = "🟡"; label = `GREED (${score}/100)`; }
      else { gate = "EXTREME_GREED"; emoji = "🔴"; label = `EXTREME GREED (${score}/100)`; }

      const gated = gate === "EXTREME_FEAR" || gate === "EXTREME_GREED";
      return { score, gate, label: `${emoji} ${label}`, gated };
    }

    // ─── VOLUME TREND ────────────────────────────────────────────────────────────
    function getVolumeTrend(q) {
      const vc24 = q.volume_change_24h || 0;
      const dexVol = q.dex_volume_24h || 0;
      const c7 = q.percent_change_7d || 0;
      const vol24 = q.volume_24h || 0;

      let trend, multiplier;
      if (vc24 > 20) { trend = "SURGING"; multiplier = 1.0; }
      else if (vc24 > 0) { trend = "RISING"; multiplier = 1.0; }
      else if (vc24 > -20) { trend = "FADING"; multiplier = 0.5; }
      else { trend = "COLLAPSING"; multiplier = 0.0; }

      let weeklyTrend = "FLAT";
      if (vc24 > 20 && c7 > 5) weeklyTrend = "BUILDING";
      else if (vc24 > 0 && c7 > 0) weeklyTrend = "ABOVE_AVG";
      else if (vc24 < -20 && c7 < 0) weeklyTrend = "DRYING_UP";
      else weeklyTrend = "MIXED";

      const dexRatio = vol24 > 0 ? dexVol / vol24 : 0;
      const isOrganic = dexRatio > 0.3;

      return { trend, multiplier, weeklyTrend, dexRatio: dexRatio.toFixed(2), isOrganic };
    }

    // ─── DIVERGENCE ──────────────────────────────────────────────────────────────
    function getDivergenceSignal(q) {
      const priceUp = q.percent_change_24h > 0;
      const vt = getVolumeTrend(q);

      if (!priceUp) return { signal: "NO_SIGNAL", label: "—" };
      if (vt.trend === "SURGING" || vt.trend === "RISING") return { signal: "CONFIRMED", label: "✓ CONFIRMED" };
      if (vt.trend === "FADING") return { signal: "WEAK", label: "⚠ WEAK" };
      return { signal: "DIVERGING", label: "✗ DIVERGING" };
    }

    // ─── NARRATIVE AGE ───────────────────────────────────────────────────────────
    function detectNarrativeAge(q) {
      const c7 = q.percent_change_7d || 0;
      const c30 = q.percent_change_30d || 0;
      const c24 = q.percent_change_24h || 0;
      const c1 = q.percent_change_1h || 0;

      if (c7 > 10 && c30 < 20 && c1 > 0 && c24 > 3) return { age: "EARLY", label: "🟢 EARLY", bonus: 3 };
      if (c7 > 10 && c30 > 20 && c24 > 0) return { age: "PRIME", label: "🟡 PRIME", bonus: 1 };
      if (c30 > 80 && c24 < 5 && c1 < 1) return { age: "EXHAUSTED", label: "🔴 EXHAUSTED", bonus: -3 };
      if (c30 > 40 && c7 < c30 / 4) return { age: "LATE", label: "🟠 LATE", bonus: -1 };
      return { age: "MID", label: "⚪ MID", bonus: 0 };
    }

    // ─── PUMP EXHAUSTION ─────────────────────────────────────────────────────────
    function detectPumpExhaustion(q) {
      const c1 = q.percent_change_1h || 0;
      const c24 = q.percent_change_24h || 0;
      const volChg = q.volume_change_24h || 0;

      if (c24 <= 20) return { exhausted: false, label: "—", exitWarning: false };

      const hourlyPace = c1 * 24;
      const pumpSlowing = hourlyPace < c24 * 0.5;
      const volStillHigh = volChg > 30;

      if (pumpSlowing && volStillHigh) return { exhausted: true, label: "⚠ EXIT SOON", exitWarning: true };
      if (pumpSlowing && !volStillHigh) return { exhausted: true, label: "🚨 EXIT NOW", exitWarning: true };
      return { exhausted: false, label: "✓ RUNNING", exitWarning: false };
    }

    // ─── NARRATIVE CLASSIFY ──────────────────────────────────────────────────────
    function classifyNarrative(tags = []) {
      const t = tags.map((x) => (x.slug || x).toLowerCase());
      if (t.some((x) => ["ai", "artificial-intelligence", "machine-learning", "ai-agent"].includes(x))) return "AI";
      if (t.some((x) => ["defi", "decentralized-finance", "dex", "yield-farming", "lending"].includes(x))) return "DeFi";
      if (t.some((x) => ["meme", "memes", "dog-themed", "cat-themed"].includes(x))) return "Meme";
      if (t.some((x) => ["layer-1", "layer1", "l1", "smart-contracts", "platform"].includes(x))) return "L1";
      if (t.some((x) => ["layer-2", "layer2", "l2", "scaling", "rollup", "optimistic-rollup"].includes(x))) return "L2";
      if (t.some((x) => ["infrastructure", "interoperability", "oracle", "bridge", "storage"].includes(x))) return "Infra";
      if (t.some((x) => ["gaming", "metaverse", "nft", "play-to-earn", "gamefi"].includes(x))) return "Gaming";
      if (t.some((x) => ["stablecoin", "stable"].includes(x))) return "Stablecoin";
      if (t.some((x) => ["exchange", "cex", "centralized-exchange"].includes(x))) return "CeFi";
      return "Other";
    }

    // ─── SCORE TOKEN ─────────────────────────────────────────────────────────────
    function scoreToken(token, btc24h) {
      const q = token.quote.USD;
      const c1 = q.percent_change_1h || 0;
      const c24 = q.percent_change_24h || 0;
      const c7 = q.percent_change_7d || 0;
      const vol = q.volume_24h || 0;
      const mcap = q.market_cap || 0;
      const fdv = q.fully_diluted_market_cap || mcap;

      // Quality filters
      if (fdv < 50_000_000 || fdv > 500_000_000) return null;
      if (vol < 5_000_000) return null;
      if (q.price < 0.001) return null;
      if (Math.abs(c7) < 3.0) return null;

      const vmr = vol / fdv;
      const supplyRatio = fdv > 0 ? fdv / (mcap || fdv) : 1;
      const volTrend = getVolumeTrend(q);
      const divergence = getDivergenceSignal(q);
      const narAge = detectNarrativeAge(q);
      const pumpStatus = detectPumpExhaustion(q);
      const allPos = c1 > 0 && c24 > 0 && c7 > 0;

      let score = 0;
      if (allPos) score += 4;
      if (c24 > 3) score += 1;
      if (c24 > 8) score += 2;
      if (c24 > 20) score += 1;
      if (c7 > 5) score += 1;
      if (c7 > 20) score += 2;
      if (vmr > 0.1) score += 1;
      if (vmr > 0.25) score += 2;
      if (vmr > 0.5) score += 1;

      score = Math.round(score * volTrend.multiplier);

      if (c24 > 80) score -= 4;
      if (c7 > 200) score -= 3;
      if (vmr > 2.0) score -= 2;

      // Supply pressure — FDV/mcap ratio
      if (supplyRatio < 1.5) score += 2;
      if (supplyRatio > 3.0) score -= 2;
      if (supplyRatio > 5.0) return null;

      // Multi-timeframe volume confirmation
      if (volTrend.weeklyTrend === "BUILDING") score += 2;
      if (volTrend.weeklyTrend === "ABOVE_AVG") score += 1;
      if (volTrend.weeklyTrend === "DRYING_UP") score -= 2;

      // Organic volume bonus
      if (volTrend.isOrganic) score += 1;

      // Relative strength vs BTC
      const rs = c24 - btc24h;
      if (rs > 5) score += 2;
      if (rs > 10) score += 1;
      if (rs < -3) score -= 1;

      score += narAge.bonus;
      if (narAge.age === "EARLY" && volTrend.trend === "SURGING") score += 2;

      const tags = token.tags || [];
      const narrative = classifyNarrative(tags);

      return {
        symbol: token.symbol,
        id: token.id,
        price: q.price,
        c1,
        c24,
        c7,
        divergence,
        narAge,
        pumpStatus,
        volTrend,
        allPos,
        narrative,
        score,
      };
    }

    // ─── RENDER DASHBOARD ────────────────────────────────────────────────────────
    async function loadDashboard() {
      try {
        const response = await fetch("/api/data");
        const data = await response.json();
        
        const tokens = data.tokens || [];
        const metrics = data.metrics || {};

        const btcToken = tokens.find((t) => t.symbol === "BTC");
        const btc24h = btcToken?.quote?.USD?.percent_change_24h || 0;
        
        document.getElementById("btc-24h").textContent = `BTC 24h: ${btc24h >= 0 ? "+" : ""}${btc24h.toFixed(2)}%`;

        const regime = detectRegime(metrics);
        const fg = computeSentiment(metrics, tokens);

        const maxPos = regime.risk === "HIGH" ? 5 : regime.risk === "MED" ? 3 : 2;
        const allocPct = regime.risk === "HIGH" ? 10 : regime.risk === "MED" ? 15 : 20;
        const effectiveMaxPos = fg.gated ? 1 : maxPos;
        const effectiveAlloc = fg.gated ? 10 : allocPct;

        const scored = tokens
          .map((t) => scoreToken(t, btc24h))
          .filter(Boolean)
          .sort((a, b) => (b.score !== a.score ? b.score - a.score : (b.c1 || 0) - (a.c1 || 0)));

        const top10 = scored.slice(0, 10);

        // Narrative heat map
        const narrativeMap = {};
        top10.forEach((t) => {
          if (!narrativeMap[t.narrative]) narrativeMap[t.narrative] = { syms: [], total: 0 };
          narrativeMap[t.narrative].syms.push(t.symbol);
          narrativeMap[t.narrative].total += t.score;
        });

        const narrativeRanking = Object.entries(narrativeMap)
          .map(([name, d]) => ({
            name,
            syms: d.syms,
            avg: (d.total / d.syms.length).toFixed(1),
          }))
          .sort((a, b) => b.avg - a.avg);

        // 1h gainers
        const topGainers = scored
          .filter((t) => (t.c1 || 0) > 2)
          .sort((a, b) => (b.c1 || 0) - (a.c1 || 0))
          .slice(0, 5);

        topGainers.forEach((t) => { t.score += 2; });
        scored.sort((a, b) => (b.score !== a.score ? b.score - a.score : (b.c1 || 0) - (a.c1 || 0)));

        // Strategy Watchlist
        const watchlist = top10
          .filter((t) => t.allPos && t.divergence.signal === "CONFIRMED" && t.narAge.age !== "EXHAUSTED" && !t.pumpStatus.exitWarning)
          .slice(0, effectiveMaxPos);

        document.getElementById("last-updated").textContent = `Updated: ${new Date().toLocaleTimeString()}`;

        // Build HTML
        let html = `
          <div class="grid-summary">
            <div class="card">
              <div class="card-title">Market Regime</div>
              <div class="card-value">${regime.regime}</div>
              <div class="card-sub">${regime.note}</div>
            </div>
            <div class="card">
              <div class="card-title">Sentiment</div>
              <div class="card-value">${fg.label}</div>
              <div class="card-sub">BTC Dom: ${metrics.btc_dominance?.toFixed(1) || '--'}%</div>
            </div>
            <div class="card">
              <div class="card-title">Hottest Narrative</div>
              <div class="card-value">${narrativeRanking[0]?.name || 'None'}</div>
              <div class="card-sub">Avg Score: ${narrativeRanking[0]?.avg || '0'}</div>
            </div>
          </div>

          <div class="two-col">
            <div class="card">
              <div class="section-title">🔥 Narrative Heat Map</div>
              <table>
                <thead>
                  <tr><th>Narrative</th><th>Tokens</th><th>Avg Score</th></tr>
                </thead>
                <tbody>
                  ${narrativeRanking.map(n => `
                    <tr>
                      <td><strong>${n.name}</strong></td>
                      <td>${n.syms.join(", ")}</td>
                      <td>${n.avg}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>

            <div class="card">
              <div class="section-title">⚡ Strategy Watchlist</div>
              <div class="card-sub" style="margin-bottom: 12px;">
                Max ${effectiveMaxPos} positions (${effectiveAlloc}% allocation) | SL: 7% | TP: 20%
              </div>
              ${watchlist.length === 0 
                ? `<div class="card-sub">No confirmed signals — hold cash or wait for cleaner setup.</div>` 
                : watchlist.map(t => `
                  <div class="watchlist-item">
                    <div style="display:flex; justify-between; font-weight: 700;">
                      <span>${t.symbol} [${t.narAge.label}]</span>
                      <span>Score: ${t.score}</span>
                    </div>
                    <div class="card-sub">
                      Entry: $${t.price.toFixed(6)} | Stop: $${(t.price * 0.93).toFixed(6)} | Target: $${(t.price * 1.2).toFixed(6)}
                    </div>
                  </div>
                `).join("")}
            </div>
          </div>

          <div class="card" style="margin-bottom: 24px;">
            <div class="section-title">🚀 Top 1H Movers (Fresh Momentum)</div>
            <table>
              <thead>
                <tr><th>Symbol</th><th>Age</th><th>1h %</th><th>24h %</th><th>Score</th></tr>
              </thead>
              <tbody>
                ${topGainers.length === 0 
                  ? `<tr><td colspan="5">No tokens with >2% 1h gain in current universe</td></tr>`
                  : topGainers.map(t => `
                    <tr>
                      <td><strong>${t.symbol}</strong></td>
                      <td>${t.narAge.label}</td>
                      <td class="${t.c1 >= 0 ? 'text-green' : 'text-red'}">${t.c1.toFixed(2)}%</td>
                      <td class="${t.c24 >= 0 ? 'text-green' : 'text-red'}">${t.c24.toFixed(2)}%</td>
                      <td>${t.score}</td>
                    </tr>
                  `).join("")}
              </tbody>
            </table>
          </div>

          <div class="card">
            <div class="section-title">📊 Top Momentum Tokens</div>
            <table>
              <thead>
                <tr>
                  <th>Rank</th>
                  <th>Symbol</th>
                  <th>Narrative</th>
                  <th>Age</th>
                  <th>24h %</th>
                  <th>7d %</th>
                  <th>Divergence</th>
                  <th>Weekly Vol</th>
                  <th>DEX %</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody>
                ${top10.map((t, i) => `
                  <tr>
                    <td>${i + 1}</td>
                    <td><strong>${t.symbol}</strong></td>
                    <td>${t.narrative}</td>
                    <td>${t.narAge.label}</td>
                    <td class="${t.c24 >= 0 ? 'text-green' : 'text-red'}">${t.c24.toFixed(2)}%</td>
                    <td class="${t.c7 >= 0 ? 'text-green' : 'text-red'}">${t.c7.toFixed(2)}%</td>
                    <td>${t.divergence.label}</td>
                    <td>${t.volTrend.weeklyTrend}</td>
                    <td>${(t.volTrend.dexRatio * 100).toFixed(0)}%</td>
                    <td><strong>${t.score}</strong></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;

        document.getElementById("content").innerHTML = html;
      } catch (err) {
        console.error(err);
        document.getElementById("content").innerHTML = `<div class="loader" style="color: var(--accent-red);">Failed to load dashboard data.</div>`;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
