<script>
function setStatus(msg, live) {
  document.getElementById('status-text').textContent = msg;
  document.getElementById('pulse-dot').style.background = live ? 'var(--green)' : 'var(--text3)';
}
function showError(msg) { document.getElementById('error-area').innerHTML = `<div class="error-bar">⚠ ${msg}</div>`; }
function clearError() { document.getElementById('error-area').innerHTML = ''; }

function fmtPrice(p) {
  if (p >= 1000) return '$' + p.toLocaleString('en-US', {maximumFractionDigits:2});
  if (p >= 1)    return '$' + p.toFixed(2);
  if (p >= 0.01) return '$' + p.toFixed(4);
  return '$' + p.toFixed(6);
}
function fmtPct(v) {
  return `<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`;
}

function getVolumeTrend(q) {
  const vc24   = q.volume_change_24h || 0;
  const cexVol = q.cex_volume_24h    || 0;
  const dexVol = q.dex_volume_24h    || 0;
  const c7     = q.percent_change_7d || 0;
  const vol24  = q.volume_24h        || 0;

  let trend, mult;
  if (vc24 > 20)       { trend='SURGING';   mult=1.0; }
  else if (vc24 > 0)   { trend='RISING';    mult=1.0; }
  else if (vc24 > -20) { trend='FADING';    mult=0.5; }
  else                 { trend='COLLAPSING'; mult=0.0; }

  let weeklyTrend='FLAT';
  if      (vc24 > 20 && c7 > 5)       weeklyTrend='BUILDING';
  else if (vc24 > 0  && c7 > 0)       weeklyTrend='ABOVE_AVG';
  else if (vc24 < -20 && c7 < 0)      weeklyTrend='DRYING_UP';
  else                                 weeklyTrend='MIXED';

  const dexRatio  = vol24 > 0 ? dexVol / vol24 : 0;
  const isOrganic = dexRatio > 0.3;

  return { trend, multiplier:mult, weeklyTrend, dexRatio:dexRatio.toFixed(2), isOrganic };
}

function getDivergence(q) {
  const vt = getVolumeTrend(q);
  if (q.percent_change_24h <= 0) return { signal:'NO_SIGNAL', cls:'t-none',      label:'—'         };
  if (vt.trend==='SURGING'||vt.trend==='RISING') return { signal:'CONFIRMED', cls:'t-confirmed', label:'CONFIRMED' };
  if (vt.trend==='FADING')       return { signal:'WEAK',      cls:'t-weak',      label:'WEAK'      };
  return                                { signal:'DIVERGING',  cls:'t-diverging', label:'DIVERGING' };
}

function getNarrativeAge(q) {
  const c7=q.percent_change_7d||0, c30=q.percent_change_30d||0;
  const c24=q.percent_change_24h||0, c1=q.percent_change_1h||0;
  if (c7>10&&c30<20&&c1>0&&c24>3)       return { age:'EARLY',    cls:'t-early',    label:'🟢 EARLY',    bonus: 3 };
  if (c7>3&&c7<10&&c24>5&&c1>1)        return { age:'NASCENT',  cls:'t-early',    label:'🌱 NASCENT',  bonus: 1 };
  if (c7>10&&c30>20&&c24>0)             return { age:'PRIME',    cls:'t-prime',    label:'🟡 PRIME',    bonus: 1 };
  if (c30>80&&c24<5&&c1<1)              return { age:'EXHAUSTED',cls:'t-exhausted',label:'🔴 EXHAUSTED',bonus:-3 };
  if (c30>40&&c7<c30/4)                 return { age:'LATE',     cls:'t-late',     label:'🟠 LATE',     bonus:-1 };
  return                                       { age:'MID',      cls:'t-mid',      label:'⚪ MID',      bonus: 0 };
}

function getPumpStatus(q, narAge) {
  const c1=q.percent_change_1h||0, c24=q.percent_change_24h||0, vc=q.volume_change_24h||0;
  const threshold = narAge === 'EARLY' ? 40 : 20;
  if (c24<=threshold) return { label:'—',        cls:'t-none',    warn:false };
  const slow=(c1*24)<c24*0.5;
  if (slow&&vc>30)  return { label:'EXIT SOON', cls:'t-exit',    warn:true  };
  if (slow&&vc<=30) return { label:'EXIT NOW',  cls:'t-exit',    warn:true  };
  return                   { label:'RUNNING',   cls:'t-running', warn:false };
}

function classifyNarrative(tags=[]) {
  const t=tags.map(x=>(x.slug||x).toLowerCase());
  if (t.some(x=>['ai','artificial-intelligence','machine-learning','ai-agent'].includes(x))) return 'AI';
  if (t.some(x=>['defi','decentralized-finance','dex','yield-farming','lending'].includes(x))) return 'DeFi';
  if (t.some(x=>['meme','memes','dog-themed','cat-themed'].includes(x))) return 'Meme';
  if (t.some(x=>['layer-1','layer1','l1','smart-contracts','platform'].includes(x))) return 'L1';
  if (t.some(x=>['layer-2','layer2','l2','scaling','rollup'].includes(x))) return 'L2';
  if (t.some(x=>['infrastructure','interoperability','oracle','bridge','storage'].includes(x))) return 'Infra';
  if (t.some(x=>['gaming','metaverse','nft','play-to-earn','gamefi'].includes(x))) return 'Gaming';
  return 'Other';
}

function computeSentiment(metrics, tokens) {
  const qualified = tokens.filter(t => {
    const q=t.quote.USD;
    const fdv=q.fully_diluted_market_cap||q.market_cap||0;
    return fdv>50000000&&fdv<500000000&&(q.volume_24h||0)>5000000;
  });
  const positive24h = qualified.filter(t => (t.quote.USD.percent_change_24h||0) > 0);
  const breadth = qualified.length ? (positive24h.length / qualified.length) * 100 : 50;

  const btcDom = metrics.btc_dominance || 50;
  const btcScore = Math.max(0, Math.min(100, (65 - btcDom) * 3.33 + 50));

  const vol  = metrics.quote.USD.total_volume_24h;
  const mcap = metrics.quote.USD.total_market_cap;
  const vmr  = vol / mcap;
  const volScore = Math.min(100, vmr * 1000);

  const score = Math.round((breadth * 0.5) + (btcScore * 0.3) + (volScore * 0.2));

  let gate, label, emoji;
  if (score <= 20)      { gate='EXTREME_FEAR';  emoji='🔴'; label=`EXTREME FEAR (${score}/100)`;  }
  else if (score <= 40) { gate='FEAR';          emoji='🟠'; label=`FEAR (${score}/100)`;          }
  else if (score <= 60) { gate='NEUTRAL';       emoji='⚪'; label=`NEUTRAL (${score}/100)`;       }
  else if (score <= 80) { gate='GREED';         emoji='🟡'; label=`GREED (${score}/100)`;         }
  else                  { gate='EXTREME_GREED'; emoji='🔴'; label=`EXTREME GREED (${score}/100)`; }

  const gated = gate === 'EXTREME_FEAR' || gate === 'EXTREME_GREED';
  return { score, gate, label:`${emoji} ${label}`, gated, breadth:breadth.toFixed(0), btcScore:btcScore.toFixed(0), volScore:volScore.toFixed(0) };
}

function scoreToken(token, tagMap, btc24h=0) {
  const q=token.quote.USD;
  const fdv=q.fully_diluted_market_cap||q.market_cap||0;
  const mcap=q.market_cap||0;
  const vol=q.volume_24h||0;
  if (fdv<50000000||fdv>500000000) return null;
  if (vol<5000000||q.price<=0.001) return null;
  if (q.price>0.99&&q.price<1.01&&Math.abs(q.percent_change_7d||0)<1) return null;
  const c1=q.percent_change_1h||0, c24=q.percent_change_24h||0, c7=q.percent_change_7d||0;
  if (Math.abs(c7)<3.0) return null;
  const vmr=vol/fdv;
  const supplyRatio=fdv>0?fdv/(mcap||fdv):1;
  if (supplyRatio>5.0) return null;
  const vt=getVolumeTrend(q), div=getDivergence(q), na=getNarrativeAge(q), ps=getPumpStatus(q, na.age);
  const allPos=c1>0&&c24>0&&c7>0;
  let score=0;
  if (allPos) score+=4;
  if (c24>3) score+=1; if (c24>8) score+=2; if (c24>20) score+=1;
  if (c7>5)  score+=1; if (c7>20) score+=2;
  if (vmr>0.10) score+=1; if (vmr>0.25) score+=2; if (vmr>0.50) score+=1;
  score=Math.round(score*vt.multiplier);
  if (c24>80) score-=4; if (c7>200) score-=3; if (vmr>2.0) score-=2;
  if (supplyRatio<1.5) score+=2;
  if (supplyRatio>3.0) score-=2;
  if (vt.weeklyTrend==='BUILDING')  score+=2;
  if (vt.weeklyTrend==='ABOVE_AVG') score+=1;
  if (vt.weeklyTrend==='DRYING_UP') score-=2;
  if (vt.isOrganic) score+=1;
  const rs=c24-btc24h;
  if (rs>10) score+=2;
  else if (rs>5) score+=1;
  else if (rs<-3) score-=1;
  score+=na.bonus;
  if (na.age==='EARLY'&&vt.trend==='SURGING') score+=2;
  return { symbol:token.symbol, id:token.id, price:q.price, c1, c24, c7,
           divergence:div, narAge:na, pumpStatus:ps, volTrend:vt,
           allPos, narrative:'Other', score };
}

function detectRegime(m) {
  const btc=m.btc_dominance, vol=m.quote.USD.total_volume_24h, mcap=m.quote.USD.total_market_cap;
  if (btc>58) return {regime:'BTC_DOMINANCE',cls:'',   risk:'LOW', note:'Altcoins suppressed — be very selective',maxPos:2,alloc:20,btc,mcap,vol};
  if (btc<50) return {regime:'ALTSEASON',    cls:'alt',risk:'HIGH',note:'Broad altcoin momentum — wider opportunities',maxPos:5,alloc:10,btc,mcap,vol};
  if (vol/mcap>0.05) return {regime:'ACTIVE',cls:'',  risk:'MED', note:'Healthy volume — standard sizing',maxPos:3,alloc:15,btc,mcap,vol};
  return              {regime:'QUIET',       cls:'',   risk:'LOW', note:'Low volume — reduce position sizes',maxPos:2,alloc:20,btc,mcap,vol};
}

function renderRegime(r, fg) {
  document.getElementById('regime-area').innerHTML = `
    <div class="regime-bar">
      <span class="regime-badge ${r.cls}">${r.regime}</span>
      <span class="regime-meta">BTC Dom <strong>${r.btc.toFixed(1)}%</strong></span>
      <span class="regime-meta">MCap <strong>$${(r.mcap/1e12).toFixed(2)}T</strong></span>
      <span class="regime-meta">Vol <strong>$${(r.vol/1e9).toFixed(1)}B</strong></span>
      <span class="regime-meta" title="Breadth: ${fg.breadth}% tokens positive · BTC score: ${fg.btcScore}/100 · Vol score: ${fg.volScore}/100" style="cursor:help">Sentiment <strong>${fg.label}</strong></span>
      <span class="regime-note">${r.note}</span>
    </div>`;
}

function renderNarratives(tokens) {
  const map={};
  tokens.forEach(t=>{
    if (!map[t.narrative]) map[t.narrative]={total:0,count:0,syms:[]};
    map[t.narrative].total+=t.score; map[t.narrative].count++;
    map[t.narrative].syms.push(t.symbol);
  });
  const ranked=Object.entries(map).map(([n,d])=>({name:n,avg:d.total/d.count,syms:d.syms})).sort((a,b)=>b.avg-a.avg);
  document.getElementById('nar-grid').innerHTML=ranked.map((n,i)=>`
    <div class="nar-card ${i===0?'hot':''}">
      <div class="nar-name">${i===0?'HOTTEST — ':''}${n.name}</div>
      <div class="nar-score">${n.avg.toFixed(1)}</div>
      <div class="nar-tokens">${n.syms.join(' · ')}</div>
    </div>`).join('');
  return ranked;
}

function renderCategories(cats) {
  const top=cats.filter(c=>c.market_cap>100000000&&c.avg_price_change!==undefined)
    .map(c=>({name:c.name,change:c.avg_price_change||0,mcap:c.market_cap,tokens:c.num_tokens}))
    .sort((a,b)=>b.change-a.change).slice(0,6);
  document.getElementById('cat-grid').innerHTML=top.map((c,i)=>`
    <div class="cat-card ${i===0?'top':''}">
      <div class="cat-name">${i===0?'🔥 ':''}${c.name}</div>
      <div class="cat-change ${c.change>=0?'pos':'neg'}">${c.change>=0?'+':''}${c.change.toFixed(2)}%</div>
      <div class="cat-meta">$${(c.mcap/1e9).toFixed(1)}B mcap · ${c.tokens} tokens</div>
    </div>`).join('');
  return top;
}

function renderAlignment(topCats, narRanking) {
  if (!topCats.length||!narRanking.length) return;
  const topCMC=topCats[0].name;
  const topNar=narRanking[0].name.toLowerCase();
  const match=topCats.slice(0,3).some(c=>c.name.toLowerCase().includes(topNar)||topNar.includes(c.name.toLowerCase().split(' ')[0]));
  document.getElementById('align-area').innerHTML=`
    <div class="align-card" style="border-color:${match?'var(--gborder)':'var(--aborder)'}">
      <div class="align-text">
        ${match?'✅':'⚠️'} <strong>Signal alignment:</strong> CMC's leading category is <strong>${topCMC}</strong>.
        Our heat map shows <strong>${narRanking[0].name}</strong> leading.
        ${match?'Both agree — higher confidence.':'Divergence detected — use extra caution.'}
      </div>
    </div>`;
}

function renderTable(tokens) {
  document.getElementById('token-table').innerHTML=tokens.slice(0,20).map((t,i)=>{
    const watch = i >= 10 ? ' <span style="font-size:10px;color:var(--text3)">👁 WATCH</span>' : '';
    return `
    <tr>
      <td style="color:var(--text3)">${i+1}</td>
      <td style="font-weight:700">${t.symbol}${watch}</td>
      <td style="color:var(--text2)">${t.narrative}</td>
      <td><span class="tag ${t.narAge.cls}">${t.narAge.label}</span></td>
      <td>${fmtPct(t.c24)}</td>
      <td>${fmtPct(t.c7)}</td>
      <td><span class="tag ${t.divergence.cls}">${t.divergence.label}</span></td>
      <td><span class="tag ${t.pumpStatus.cls}">${t.pumpStatus.label}</span></td>
      <td style="font-weight:700;color:var(--blue)">${t.score}</td>
    </tr>`;
  }).join('');
}

function renderWatchlist(tokens, regime, fg) {
  const effMax=fg.gated?1:regime.maxPos, effAlloc=fg.gated?10:regime.alloc;
  const wl=tokens.filter(t=>t.allPos&&t.divergence.signal==='CONFIRMED'&&t.narAge.age!=='EXHAUSTED'&&!t.pumpStatus.warn).slice(0,effMax);
  document.getElementById('wl-count').textContent=`${wl.length} signal${wl.length!==1?'s':''}`;
  document.getElementById('wl-subtext').textContent=`Max ${effMax} positions · ${effAlloc}% each · 7% stop · 20% target`;
  document.getElementById('wl-body').innerHTML=wl.length===0
    ?`<div class="empty">No confirmed signals<br><span style="font-size:11px;color:var(--text3)">Hold cash — wait for cleaner setup</span></div>`
    :wl.map(t=>`
      <div class="wl-item">
        <div class="wl-top">
          <div>
            <div class="wl-sym">${t.symbol}</div>
            <span class="tag ${t.narAge.cls}" style="margin-top:4px;display:inline-block">${t.narAge.label}</span>
          </div>
          <div class="score-pill">${t.score}</div>
        </div>
        <div class="wl-grid">
          <div><div class="wl-lbl">Entry</div><div class="wl-val">${fmtPrice(t.price)}</div></div>
          <div><div class="wl-lbl">Stop</div><div class="wl-val stop">${fmtPrice(t.price*0.93)}</div></div>
          <div><div class="wl-lbl">Target</div><div class="wl-val tgt">${fmtPrice(t.price*1.20)}</div></div>
        </div>
        ${t.pumpStatus.warn?`<div style="margin-top:8px"><span class="tag t-exit">⚠ ${t.pumpStatus.label}</span></div>`:''}
      </div>`).join('');
}

// ─── SIGNAL HISTORY SIDEBAR ──────────────────────────────────────────────────

function openHistory() {
  document.getElementById('hist-overlay').style.display = 'block';
  document.getElementById('hist-panel').style.display   = 'flex';
  loadHistory();
}

function closeHistory() {
  document.getElementById('hist-overlay').style.display = 'none';
  document.getElementById('hist-panel').style.display   = 'none';
}

function outcomeTag(outcome) {
  if (!outcome)                  return `<span class="tag t-confirmed">OPEN</span>`;
  if (outcome==='TARGET_HIT')    return `<span class="tag t-confirmed">TARGET HIT</span>`;
  if (outcome==='STOPPED_OUT')   return `<span class="tag t-exit">STOPPED OUT</span>`;
  return                                `<span class="tag t-mid">EXPIRED</span>`;
}

async function loadHistory() {
  document.getElementById('hist-signals').innerHTML = '<div class="hist-empty">Loading...</div>';
  try {
    const res  = await fetch('/api/signals');
    const data = await res.json();
    const s    = data.summary || {};

    document.getElementById('hist-stats').innerHTML = `
      <div class="hist-stat">
        <div class="hist-stat-val" style="color:${(s.winRate||0)>=50?'var(--green)':'var(--red)'}">${s.winRate||0}%</div>
        <div class="hist-stat-lbl">Win rate</div>
      </div>
      <div class="hist-stat">
        <div class="hist-stat-val" style="color:${(s.avgReturn||0)>=0?'var(--green)':'var(--red)'}">${(s.avgReturn||0)>=0?'+':''}${s.avgReturn||0}%</div>
        <div class="hist-stat-lbl">Avg return</div>
      </div>
      <div class="hist-stat">
        <div class="hist-stat-val" style="color:var(--text)">${s.total||0}</div>
        <div class="hist-stat-lbl">Signals</div>
      </div>
      <div class="hist-stat">
        <div class="hist-stat-val" style="color:var(--green)">${s.targetHit||0}</div>
        <div class="hist-stat-lbl">Targets</div>
      </div>
      <div class="hist-stat">
        <div class="hist-stat-val" style="color:var(--red)">${s.stoppedOut||0}</div>
        <div class="hist-stat-lbl">Stopped</div>
      </div>
      <div class="hist-stat">
        <div class="hist-stat-val" style="color:var(--blue)">${s.open||0}</div>
        <div class="hist-stat-lbl">Open</div>
      </div>`;

    const signals = (data.signals||[]).sort((a,b)=>new Date(b.openedAt)-new Date(a.openedAt));

    if (!signals.length) {
      document.getElementById('hist-signals').innerHTML =
        `<div class="hist-empty">No signals yet.<br><span style="font-size:11px">Signals appear here after<br>the bot fires its first alert.</span></div>`;
      return;
    }

    const ageCls = { EARLY:'t-early', NASCENT:'t-early', PRIME:'t-prime', MID:'t-mid', LATE:'t-late', EXHAUSTED:'t-exhausted' };

    document.getElementById('hist-signals').innerHTML = signals.map(s => {
      const ret = s.returnPct !== null
        ? `<span class="hist-ret" style="color:${s.returnPct>=0?'var(--green)':'var(--red)'}">${s.returnPct>=0?'+':''}${s.returnPct}%</span>`
        : `<span class="hist-ret" style="color:var(--text3)">—</span>`;
      const date = new Date(s.openedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
      const cls  = ageCls[s.narrativeAge] || 't-mid';
      return `<div class="hist-signal-card">
        <div class="hist-card-top">
          <div style="display:flex;align-items:center;gap:8px">
            <span class="hist-sym">${s.symbol}</span>
            <span class="tag ${cls}">${s.narrativeAge||'MID'}</span>
          </div>
          ${outcomeTag(s.outcome)}
        </div>
        <div class="hist-prices">
          <div>
            <div class="hist-price-lbl">Entry</div>
            <div class="hist-price-val">${fmtPrice(s.entry)}</div>
          </div>
          <div>
            <div class="hist-price-lbl">Stop</div>
            <div class="hist-price-val" style="color:var(--red)">${fmtPrice(s.stop)}</div>
          </div>
          <div>
            <div class="hist-price-lbl">Target</div>
            <div class="hist-price-val" style="color:var(--green)">${fmtPrice(s.target)}</div>
          </div>
        </div>
        <div class="hist-card-foot">
          <span class="hist-date">${date} · ${s.regime||''}</span>
          ${ret}
        </div>
      </div>`;
    }).join('');

  } catch(e) {
    document.getElementById('hist-signals').innerHTML =
      `<div class="hist-empty" style="color:var(--red)">Failed to load: ${e.message}</div>`;
  }
}

// ─── MAIN FETCH FUNCTION ─────────────────────────────────────────────────────

async function loadData() {
  clearError();
  const btn=document.getElementById('run-btn');
  btn.disabled=true; btn.textContent='Loading...';
  setStatus('Fetching market data...', false);
  try {
    const h={'Accept':'application/json'};
    const [listRes,metaRes,catRes]=await Promise.all([
      fetch('/api/proxy/v1/cryptocurrency/listings/latest?limit=500&convert=USD&sort=market_cap',{headers:h}),
      fetch('/api/proxy/v1/global-metrics/quotes/latest?convert=USD',{headers:h}),
      fetch('/api/proxy/v1/cryptocurrency/categories?limit=50&convert=USD',{headers:h})
    ]);
    const [listData,metaData,catData]=await Promise.all([listRes.json(),metaRes.json(),catRes.json()]);
    if (listData.status?.error_code) { showError(listData.status.error_message); setStatus('Error',false); btn.disabled=false; btn.textContent='Run signals'; return; }
    if (!listData.data) { showError('API error — please try again'); setStatus('Error',false); btn.disabled=false; btn.textContent='Run signals'; return; }

    setStatus('Fetching token tags...', false);
    const tokens=listData.data;
    const btcToken=tokens.find(t=>t.symbol==='BTC');
    const btc24h=btcToken?.quote?.USD?.percent_change_24h||0;
    const ids=tokens.slice(0,100).map(t=>t.id).join(',');
    const infoRes=await fetch(`/api/proxy/v2/cryptocurrency/info?id=${ids}&aux=tags`,{headers:h});
    const infoData=await infoRes.json();
    const tagMap={};
    Object.entries(infoData.data||{}).forEach(([id,info])=>{ tagMap[parseInt(id)]=info.tags||[]; });

    const scored=tokens.map(t=>scoreToken(t,tagMap,btc24h)).filter(Boolean).sort((a,b)=>{
      if (b.score!==a.score) return b.score-a.score;
      return (b.c1||0)-(a.c1||0);
    });

    const topGainers=[...scored].filter(t=>(t.c1||0)>2).sort((a,b)=>(b.c1||0)-(a.c1||0)).slice(0,5);
    topGainers.forEach(t=>{ t.score+=2; });
    scored.sort((a,b)=>{
      if (b.score!==a.score) return b.score-a.score;
      return (b.c1||0)-(a.c1||0);
    });

    const regime=detectRegime(metaData.data);
    const fg=computeSentiment(metaData.data, tokens);
    const cats=catData.data||[];

    renderRegime(regime,fg);
    const narRanking=renderNarratives(scored.slice(0,20));
    const topCats=renderCategories(cats);
    renderAlignment(topCats,narRanking);
    renderTable(scored);
    renderWatchlist(scored,regime,fg);

    document.getElementById('main-content').style.display='grid';
    setStatus(`Live · ${new Date().toLocaleTimeString()}`,true);
  } catch(e) {
    showError(e.message);
    setStatus('Error',false);
  } finally {
    btn.disabled=false; btn.textContent='Refresh';
  }
}
</script>
